services:
  # Grafana dev server — mounts our built plugin
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource 4.20.0"
      GF_DEFAULT_APP_MODE: development
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
    depends_on:
      - clickhouse

  # ClickHouse — OTel-compatible schema
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    ports:
      - "8123:8123"   # HTTP interface (used by the datasource plugin)
      - "9000:9000"   # Native protocol
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/clickhouse-init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ollama — local OpenAI-compatible LLM server, used to test the "Guess with AI" column-mapping
  # assist against a weak/self-hosted model. OLLAMA_ORIGINS=* is required so the Grafana browser
  # frontend (a different origin) can call it directly (frontend-direct calls, no backend proxy).
  # After first `docker compose up`, pull a small model once:
  #   docker compose exec ollama ollama pull qwen2.5:1.5b
  # Then in the plugin's Configuration page → AI Assistant, set:
  #   API base URL: http://localhost:11434/v1   Model: qwen2.5:1.5b   Token: (blank)
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_data:/root/.ollama

  # OTel collector — receives OTLP and ships to ClickHouse
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  ollama_data:
